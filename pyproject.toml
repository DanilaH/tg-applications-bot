[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-booking-bot"
version = "0.1.0"
description = "Demo Telegram bot for collecting local business booking requests"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.25,<4",
    "pydantic-settings>=2,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
